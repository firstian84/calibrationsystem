<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1F VJ Motion - Auto Credit System</title>
    <style>
        :root {
            --primary: #00f2fe;
            --bg: #000000;
            --gold: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --glow-white: 0 0 5px rgba(255, 255, 255, 1), 0 0 30px rgba(255, 255, 255, 0.4);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        /* --- VJ Viewport --- */
        #visual-display {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: grid; gap: 15px; padding: 20px;
            box-sizing: border-box; z-index: 1;
        }

        /* --- Motion Animations --- */
        @keyframes camZoomIn { from { transform: scale(1); } to { transform: scale(1.4); } }
        @keyframes camZoomOut { from { transform: scale(1.4); } to { transform: scale(1); } }
        @keyframes camPanLeft { from { transform: scale(1.2) translateX(8%); } to { transform: scale(1.2) translateX(-8%); } }
        @keyframes camPanRight { from { transform: scale(1.2) translateX(-8%); } to { transform: scale(1.2) translateX(8%); } }

        .motion-cam {
            width: 100%; height: 100%;
            object-fit: cover;
            animation-fill-mode: forwards;
            animation-timing-function: ease-in-out;
        }

        /* --- Overlay (Intro/Credit) --- */
        #overlay-layer {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10001; background: black;
            display: none; justify-content: center; align-items: center;
        }
        #overlay-layer img, #overlay-layer video { width: 100%; height: 100%; object-fit: contain; }

        /* --- Layout Styles --- */
        .layout-1 { grid-template-columns: 1fr; }
        .layout-2 { grid-template-columns: 1fr 1fr; }
        .layout-3 { grid-template-columns: 1fr 1fr 1fr; }
        .layout-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .layout-10 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
        .layout-11 { display: block !important; position: relative; }
        .layout-12 { display: block !important; position: relative; }

        .media-slot {
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; background: #000; border-radius: 12px;
            position: relative; border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.15);
        }
        
        .bg-under { 
            position: absolute !important; top: 0; left: 0; 
            width: 100% !important; height: 100% !important; 
            z-index: 0 !important; opacity: 0.5; filter: blur(20px); 
        }

        /* --- UI PANEL --- */
        .panel {
            position: absolute; bottom: 20px; left: 20px; width: 320px;
            background: rgba(0, 0, 0, 0.9); padding: 25px; border-radius: 20px;
            backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.2); 
            z-index: 10000; transition: 0.4s ease; max-height: 80vh; overflow-y: auto;
        }
        .panel.hide { opacity: 0; visibility: hidden; transform: translateY(30px); }

        .brand-container { position: relative; width: 100%; height: 90px; margin-bottom: 15px; }
        .gold-num { font-family: Georgia, serif; background: var(--gold); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 80px; position: absolute; left: 0; top: -5px; z-index: 3; }
        .black-f { font-family: 'Vivaldi', cursive; color: #000; text-shadow: 0 0 5px white; font-weight: 900; font-size: 45px; position: absolute; left: 0px; top: 22px; z-index: 2; }
        .white-text-brand { font-family: "Times New Roman", serif; color: #fff; text-shadow: var(--glow-white); font-size: 24px; position: absolute; left: 60px; top: 35px; z-index: 2; letter-spacing: 2px; }
        .brand-sub { font-family: Arial, sans-serif; color: #000; text-shadow: 0 0 8px white; font-size: 9px; text-transform: uppercase; font-weight: bold; position: absolute; left: 50px; top: 65px; z-index: 4; letter-spacing: 3px; }

        label { display: block; margin: 12px 0 5px; font-size: 10px; color: #aaa; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .layout-picker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .layout-opt { background: #1a1a1a; border: 1px solid #333; color: white; padding: 8px; font-size: 10px; text-align: center; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .layout-opt.active { background: var(--primary); color: black; border-color: white; font-weight: bold; }

        input[type="number"], input[type="range"], input[type="file"] { 
            background: #111; border: 1px solid #333; color: var(--primary); 
            padding: 8px; border-radius: 6px; width: 100%; box-sizing: border-box; font-size: 11px;
        }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 25px; }
        button { padding: 14px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 11px; text-transform: uppercase; transition: 0.3s; }
        button:hover { transform: scale(1.02); filter: brightness(1.2); }
        #btnPreview { background: #00c6ff; color: white; }
        #btnRecord { background: #ff4b2b; color: white; }
        .status { font-size: 10px; color: var(--primary); margin-top: 15px; text-align: center; font-family: monospace; }
    </style>
</head>
<body>

    <div id="overlay-layer"></div>
    <div id="visual-display"></div>

    <div class="panel" id="ui">
        <div class="brand-container">
            <span class="gold-num">1</span>
            <span class="black-f">F</span>
            <span class="white-text-brand">irstian</span>
            <div class="brand-sub">Technology</div>
        </div>
        
        <label>Visual Library (Images/Videos)</label>
        <input type="file" id="mediaInput" accept="image/*,video/*" multiple>

        <div style="display: flex; gap: 10px;">
            <div style="flex:1">
                <label>Intro (Sec)</label>
                <input type="number" id="introDur" value="4">
            </div>
            <div style="flex:1">
                <label>Credit (Sec)</label>
                <input type="number" id="creditDur" value="5">
            </div>
        </div>

        <label>Intro & Credit Files</label>
        <input type="file" id="introInput" accept="image/*,video/*">
        <input type="file" id="creditInput" accept="image/*,video/*" style="margin-top:5px">

        <label>Background Music</label>
        <input type="file" id="audioInput" accept="audio/*">

        <label>Layouts Pool</label>
        <div class="layout-picker" id="layoutPicker">
            <div class="layout-opt active" data-layout="1">1</div>
            <div class="layout-opt active" data-layout="2">2</div>
            <div class="layout-opt active" data-layout="3">3</div>
            <div class="layout-opt active" data-layout="4">4</div>
            <div class="layout-opt active" data-layout="10">9</div>
            <div class="layout-opt active" data-layout="11">BG</div>
            <div class="layout-opt active" data-layout="12">★</div>
        </div>
        
        <label>Sensitivity</label>
        <input type="range" id="sensitivity" min="30" max="230" value="145">

        <label>Beat Cooldown (ms)</label>
        <input type="range" id="cooldown" min="100" max="2000" value="480">

        <div class="btn-group">
            <button id="btnPreview">START VJ</button>
            <button id="btnRecord">REC & START</button>
        </div>
        <div class="status" id="statusText">SYSTEM READY</div>
    </div>

    <audio id="player"></audio>

    <script>
        const ui = document.getElementById('ui'), 
              display = document.getElementById('visual-display'),
              overlay = document.getElementById('overlay-layer'), 
              player = document.getElementById('player'),
              sensitivity = document.getElementById('sensitivity'), 
              cooldown = document.getElementById('cooldown');

        let mediaLibrary = [], introMedia = null, creditMedia = null;
        let audioCtx, analyser, dataArray, lastBeat = 0, isActive = false;
        let activeLayouts = [1,2,3,4,10,11,12], recordedChunks = [], mediaRecorder;

        // --- File Handlers ---
        document.getElementById('mediaInput').onchange = (e) => {
            mediaLibrary = Array.from(e.target.files).map(f => ({ url: URL.createObjectURL(f), type: f.type.startsWith('video')?'video':'image' }));
        };
        document.getElementById('introInput').onchange = (e) => {
            const f = e.target.files[0]; if(f) introMedia = { url: URL.createObjectURL(f), type: f.type.startsWith('video')?'video':'image' };
        };
        document.getElementById('creditInput').onchange = (e) => {
            const f = e.target.files[0]; if(f) creditMedia = { url: URL.createObjectURL(f), type: f.type.startsWith('video')?'video':'image' };
        };
        document.getElementById('audioInput').onchange = (e) => { 
            if(e.target.files[0]) player.src = URL.createObjectURL(e.target.files[0]); 
        };

        // EVENT UTAMA: Jika musik habis, panggil handleStop untuk jalankan Credit
        player.onended = () => {
            if(isActive) handleStop();
        };

        document.getElementById('btnPreview').onclick = () => isActive ? handleStop() : handleStart(false);
        document.getElementById('btnRecord').onclick = () => isActive ? handleStop() : handleStart(true);

        async function handleStart(isRecording) {
            if (mediaLibrary.length === 0 || !player.src) return alert("Pilih Media dan Musik dulu!");
            
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioCtx.createMediaElementSource(player);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 128;
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            await audioCtx.resume();
            ui.classList.add('hide');
            isActive = true;

            if (isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                    mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                    mediaRecorder.ondataavailable = (e) => recordedChunks.push(e.data);
                    mediaRecorder.onstop = saveVideo;
                    mediaRecorder.start();
                } catch (e) { console.warn("Recording cancelled"); }
            }

            if (introMedia) {
                await playOverlayMedia(introMedia, parseInt(document.getElementById('introDur').value) * 1000);
            }
            
            player.play();
            renderLoop();
        }

        async function handleStop() {
            isActive = false;
            player.pause();
            
            // Bersihkan visual VJ agar Credit terlihat bersih
            display.innerHTML = ""; 
            display.className = "";

            // Jalankan Credit jika ada
            if (creditMedia) {
                await playOverlayMedia(creditMedia, parseInt(document.getElementById('creditDur').value) * 1000);
            }
            
            player.currentTime = 0;
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            
            ui.classList.remove('hide');
        }

        function playOverlayMedia(media, duration) {
            return new Promise((resolve) => {
                overlay.innerHTML = ''; 
                overlay.style.display = 'flex';
                let el;
                
                if (media.type === 'video') {
                    el = document.createElement('video');
                    el.src = media.url;
                    el.autoplay = true; el.muted = false;
                    el.onended = () => { finish(); };
                } else {
                    el = document.createElement('img');
                    el.src = media.url;
                    const anims = ['camZoomIn', 'camZoomOut', 'camPanLeft', 'camPanRight'];
                    el.className = 'motion-cam';
                    el.style.animationName = anims[Math.floor(Math.random() * anims.length)];
                    el.style.animationDuration = (duration / 1000) + 's';
                }

                const timer = setTimeout(() => finish(), duration);

                function finish() {
                    clearTimeout(timer);
                    overlay.style.display = 'none'; 
                    overlay.innerHTML = '';
                    resolve();
                }

                overlay.appendChild(el);
            });
        }

        function renderLoop() {
            if (!isActive) return;
            requestAnimationFrame(renderLoop);
            if (overlay.style.display !== 'flex') {
                analyser.getByteFrequencyData(dataArray);
                let bass = (dataArray[0] + dataArray[1] + dataArray[2]) / 3;
                if (bass > parseInt(sensitivity.value) && Date.now() - lastBeat > parseInt(cooldown.value)) {
                    updateVisuals(); 
                    lastBeat = Date.now();
                }
            }
        }

        function updateVisuals() {
            const layoutIdx = activeLayouts[Math.floor(Math.random() * activeLayouts.length)];
            
            if (layoutIdx !== 12 || display.className !== 'layout-12') {
                display.innerHTML = "";
            }

            display.className = `layout-${layoutIdx}`;

            if (layoutIdx === 11) {
                display.appendChild(createSlot(true)); 
                const main = createSlot(false);
                main.style.width = "75%"; main.style.height = "75%"; main.style.margin = "auto";
                main.style.position = "relative";
                display.appendChild(main);
            } 
            else if (layoutIdx === 12) {
                const card = createSlot(false);
                card.style.position = 'absolute';
                card.style.left = (Math.random() * 60) + '%'; 
                card.style.top = (Math.random() * 50) + '%';
                card.style.width = '400px'; card.style.height = '500px';
                card.style.zIndex = display.children.length;
                display.appendChild(card);
                if (display.children.length > 6) display.removeChild(display.firstChild);
                setTimeout(() => { if(card.parentNode) card.remove(); }, 2500);
            } 
            else {
                let count = {1:1, 2:2, 3:3, 4:4, 10:9}[layoutIdx] || 1;
                for (let i = 0; i < count; i++) display.appendChild(createSlot(false));
            }
        }

        function createSlot(isBg = false) {
            const slot = document.createElement('div');
            slot.className = isBg ? 'media-slot bg-under' : 'media-slot';
            const item = mediaLibrary[Math.floor(Math.random() * mediaLibrary.length)];
            let el = item.type === 'image' ? document.createElement('img') : document.createElement('video');
            el.src = item.url;

            if(item.type === 'video') { 
                el.autoplay = true; el.muted = true; el.loop = true; 
                el.style.width = "100%"; el.style.height = "100%"; el.style.objectFit = "cover";
            } else {
                const anims = ['camZoomIn', 'camZoomOut', 'camPanLeft', 'camPanRight'];
                el.className = 'motion-cam';
                el.style.animationName = anims[Math.floor(Math.random() * anims.length)];
                el.style.animationDuration = '10s';
            }
            slot.appendChild(el);
            return slot;
        }

        function saveVideo() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = `firstianTECHNOLOGY-vdjAUTO.webm`; a.click();
            recordedChunks = [];
        }

        document.getElementById('layoutPicker').onclick = (e) => {
            if(e.target.classList.contains('layout-opt')) {
                e.target.classList.toggle('active');
                activeLayouts = Array.from(document.querySelectorAll('.layout-opt.active')).map(el => parseInt(el.dataset.layout));
            }
        };

        window.onkeydown = (e) => { 
            if (e.key.toLowerCase() === 'h') ui.classList.toggle('hide'); 
            if (e.key === 'Escape') handleStop();
        };
    </script>
</body>
</html>
